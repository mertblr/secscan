<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecScan</title>

    <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1f2937;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f3f4f6;
    }
    .severity {
      width: fit-content;
      padding: 2px 8px;
      margin: 2px 0;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .severity-critical { background: #7f1d1d; color: white; }
    .severity-high     { background: #fee2e2; color: #991b1b; }
    .severity-moderate { background: #fef3c7; color: #92400e; }
    .severity-low      { background: #e0f2fe; color: #075985; }
    .severity-unknown  { background: #e5e7eb; color: #374151; }

    #skipped {
      color: #92400e;
    }
  </style>
</head>
<body>
  <h1>SecScan</h1>
  <p>Upload a requirements.txt file to check for known vulnerabilities.</p>

  <input type="file" id="file-input">
  <button id="scan-button">Scan</button>

  <pre id="result"></pre>

 
  <table id="result-table" hidden>
    <thead>
      <tr>
        <th>Package</th>
        <th>Version</th>
        <th>Vulnerabilities</th>
        <th>Recommended</th>
      </tr>
    </thead>
    <tbody id="result-body"></tbody>
  </table>
  <p id="skipped"></p>
  <h2>Recent scans</h2>
  <ul id="history"></ul>

  <script>
    const fileInput = document.getElementById("file-input");
    const scanButton = document.getElementById("scan-button");
    const resultBox = document.getElementById("result");


    function addCell(row, text) {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }


    function renderTable(data) {
      const tableBody = document.getElementById("result-body");
      tableBody.innerHTML = "";

      for (const pkg of data.packages) {
        const row = document.createElement("tr");

        addCell(row, pkg.name);
        addCell(row, pkg.version);

        const vulnCell = addCell(row, "");
        if (pkg.vulnerabilities.length === 0) {
          vulnCell.textContent = "✅ No known vulnerabilities";
        } else {
          for (const vuln of pkg.vulnerabilities) {
            const line = document.createElement("div");
            line.textContent = `${vuln.severity}: ${vuln.cve}`;
            line.classList.add("severity", "severity-" + vuln.severity.toLowerCase());
            vulnCell.appendChild(line);
          }
        }

        addCell(row, pkg.recommended_version ?? "–");

        tableBody.appendChild(row);
      }
      
      const skippedBox = document.getElementById("skipped");
      if (data.skipped.length > 0) {
        skippedBox.textContent = "⚠️ Skipped (no exact version): " + data.skipped.join(", ");
      } else {
        skippedBox.textContent = "";
      }

      document.getElementById("result-table").hidden = false;
    }

    async function loadHistory() {
      const response = await fetch("/scans");
      const scans = await response.json();

      const list = document.getElementById("history");
      list.innerHTML = "";

      for (const scan of scans) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = `${scan.filename} – ${scan.created_at.replace("T", " ")}`;

        link.addEventListener("click", async (event) => {
          event.preventDefault();
          const res = await fetch(`/scans/${scan.id}`);
          const data = await res.json();
          renderTable(data.result);
        });

        item.appendChild(link);
        list.appendChild(item);
      }
    }

    loadHistory();

    scanButton.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        resultBox.textContent = "Please choose a file first.";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      resultBox.textContent = "Scanning...";
      const response = await fetch("/scan", { method: "POST", body: formData });
      const data = await response.json();
      resultBox.textContent = "";   
      renderTable(data);         
      loadHistory();   
    });
  </script>
</body>
</html>
