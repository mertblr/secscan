<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecScan</title>

    <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1f2937;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f3f4f6;
    }
    .severity {
      width: fit-content;
      padding: 2px 8px;
      margin: 2px 0;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .severity-critical { background: #7f1d1d; color: white; }
    .severity-high     { background: #fee2e2; color: #991b1b; }
    .severity-moderate { background: #fef3c7; color: #92400e; }
    .severity-low      { background: #e0f2fe; color: #075985; }
    .severity-unknown  { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <h1>SecScan</h1>
  <p>Upload a requirements.txt file to check for known vulnerabilities.</p>

  <input type="file" id="file-input">
  <button id="scan-button">Scan</button>

  <pre id="result"></pre>

  <!-- YENİ: Sonuç tablosu. "hidden" = başta gizli -->
  <table id="result-table" hidden>
    <thead>
      <tr>
        <th>Package</th>
        <th>Version</th>
        <th>Vulnerabilities</th>
        <th>Recommended</th>
      </tr>
    </thead>
    <tbody id="result-body"></tbody>
  </table>

  <script>
    const fileInput = document.getElementById("file-input");
    const scanButton = document.getElementById("scan-button");
    const resultBox = document.getElementById("result");

    // YENİ: Bir satıra hücre ekleyen yardımcı fonksiyon
    function addCell(row, text) {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }

    // YENİ: Sonucu tabloya çeviren fonksiyon
    function renderTable(data) {
      const tableBody = document.getElementById("result-body");
      tableBody.innerHTML = "";

      for (const pkg of data.packages) {
        const row = document.createElement("tr");

        addCell(row, pkg.name);
        addCell(row, pkg.version);

        const vulnCell = addCell(row, "");
        if (pkg.vulnerabilities.length === 0) {
          vulnCell.textContent = "✅ No known vulnerabilities";
        } else {
          for (const vuln of pkg.vulnerabilities) {
            const line = document.createElement("div");
            line.textContent = `${vuln.severity}: ${vuln.cve}`;
            line.classList.add("severity", "severity-" + vuln.severity.toLowerCase());
            vulnCell.appendChild(line);
          }
        }

        addCell(row, pkg.recommended_version ?? "–");

        tableBody.appendChild(row);
      }

      document.getElementById("result-table").hidden = false;
    }

    scanButton.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        resultBox.textContent = "Please choose a file first.";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      resultBox.textContent = "Scanning...";
      const response = await fetch("/scan", { method: "POST", body: formData });
      const data = await response.json();
      resultBox.textContent = "";   // DEĞİŞTİ: "Scanning..." yazısını sil
      renderTable(data);            // DEĞİŞTİ: JSON yerine tablo göster
    });
  </script>
</body>
</html>
